<div class="app-login-pane">
  <h1 class="app-login-pane-title">nimba.ai</h1>
  <form class="app-login-form" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-form-field class="mat-form-field-full-width">
      <mat-label>Email</mat-label>
      <input id="email" type="email" formControlName="email" matInput [formControl]="emailFormControl" placeholder="Ex. pat@example.com">
      <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('email')">
        Please enter a valid email address
      </mat-error>
      <mat-error *ngIf="emailFormControl.hasError('required')">
        Email is <strong>required</strong>
      </mat-error>
    </mat-form-field>

    <mat-form-field class="mat-form-field-full-width">
      <mat-label>Password</mat-label>
      <input id="password" type="password" formControlName="password" matInput [formControl]="passwordFormControl" placeholder="Enter your password">
      <mat-error *ngIf="passwordFormControl.hasError('password') && !passwordFormControl.hasError('required')">
        Please enter your password
      </mat-error>
      <mat-error *ngIf="passwordFormControl.hasError('required')">
        Password is <strong>required</strong>
      </mat-error>
      <mat-error *ngIf="passwordFormControl.hasError('min')">
        Password is <strong>too short</strong>
      </mat-error>
    </mat-form-field>
    <button mat-raised-button color="primary" class="mat-form-field-full-width" type="submit" >Connect</button>
  </form>

  <mat-divider></mat-divider>

  <section>
    <div style="padding-top: 25px;">
      <mat-label>No account yet ?</mat-label>
      <a mat-button routerLink="/registration">Create new account here</a>
    </div>
  </section>
</div>
